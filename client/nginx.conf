server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Encrypted uploads can be up to 25 MB plus form overhead.
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # /api/files -> backend /files  (the trailing slash on proxy_pass strips the /api prefix)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Angular routes (/login, /account, /admin) have no real file, so fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
